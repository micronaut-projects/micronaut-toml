plugins {
    id "org.jetbrains.kotlin.jvm"
    id "io.micronaut.build.internal.kotlin-base"
    id "io.micronaut.build.internal.kotlin-ksp"
}

// The examples of the guide, in Kotlin, processed with KSP.
dependencies {
    ksp mn.micronaut.inject.kotlin
    ksp libs.micronaut.serde.processor

    implementation projects.micronautToml
    implementation projects.micronautTomlSerde

    runtimeOnly mnLogging.logback.classic

    kspTest mn.micronaut.inject.kotlin

    testImplementation mnTest.micronaut.test.junit5
    testRuntimeOnly mnTest.junit.jupiter.engine
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
}
