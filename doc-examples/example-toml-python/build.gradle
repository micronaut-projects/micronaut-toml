plugins {
    id "java-library"
    id "io.micronaut.build.internal.python"
}

// The examples of the guide, in Python, compiled by the Python compiler (micronaut-inject-python). The compiler
// takes the (jar-resolved) compile classpath as its annotation processor path, so the Micronaut processors are
// regular dependencies rather than annotationProcessor ones. The Python tests only run with -Ppython-ci.
dependencies {
    implementation mn.micronaut.inject.python
    implementation mn.micronaut.context.python
    implementation libs.micronaut.serde.processor

    implementation projects.micronautToml
    implementation projects.micronautTomlSerde

    runtimeOnly mnLogging.logback.classic

    testImplementation mn.micronaut.inject.python.test
    testImplementation mnTest.micronaut.test.junit5
    testRuntimeOnly mnTest.junit.jupiter.engine
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// TODO(python): the application code lives in src/main/python (the `source="main"` snippets) and the
// tests in src/test/python. Compiling them separately yields two GraalPy VFS roots whose generated shim
// modules shadow each other at test time, and the Python compiler resolves the imports of a source file
// only within its own source root, so both roots are merged into one directory compiled with the tests.
def mergedPythonSources = tasks.register("mergePythonSources", Sync) {
    from(layout.projectDirectory.dir("src/main/python"))
    from(layout.projectDirectory.dir("src/test/python"))
    into(layout.buildDirectory.dir("merged-python-sources"))
}
tasks.named("compilePython") {
    enabled = false
}
tasks.named("compileTestPython") {
    dependsOn(mergedPythonSources)
    source.setFrom(mergedPythonSources.map { it.destinationDir })
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    systemProperty "micronaut.python.pool.enabled", "false"
    // Gradle enables assertions in test JVMs; an internal Truffle host-interop assertion trips on varargs overloads
    enableAssertions = false
}
